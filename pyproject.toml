[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-audit"
version = "1.0.0"
description = "CI Nicaragua: Audit de Madurez Técnica para Startups — Hackathon 2026"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Cristian Rojas", email = "cristian@ci.intec"},
]
keywords = ["audit", "startup", "hackathon", "ci-nicaragua", "madurez-tecnica"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []  # stdlib only — zero external dependencies

[project.scripts]
ci-audit = "ci_audit:main"

[project.urls]
Homepage = "https://rojascristiane.github.io/ci-dashboard-diagnostico/"
Repository = "https://github.com/RojasCristianE/ci-dashboard-diagnostico"
